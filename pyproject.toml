[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abacus-rfid-platform"
dynamic = ["version"]
description = "GreyOrange Engineering take-home: multi-tenant RFID inventory and replenishment API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.18.5",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "pwdlib[argon2]==0.3.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "reportlab==5.0.0",
  "ruff==0.16.1",
]

[project.scripts]
abacus-cli = "abacus.cli:main"
abacus-catalog-worker = "abacus.processes.catalog_worker:main"
abacus-event-worker = "abacus.processes.event_worker:main"
abacus-hosted = "abacus.processes.hosted:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "abacus.__version__"}

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["abacus"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
mypy_path = "src"
