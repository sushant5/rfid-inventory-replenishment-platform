# Free hosted-demo topology: one supervised web container runs the same API and two
# worker entry points that Docker Compose runs separately. The launcher performs
# migrations because Render pre-deploy commands and background workers are paid-only.
# A production deployment should use separate services and keep the owner credential
# out of the long-running application container.
services:
  - type: web
    name: abacus-take-home
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: abacus-hosted
    autoDeployTrigger: "off"
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: APPLICATION_DATABASE_ROLE
        value: abacus_app
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_API_KEY
        sync: false
      - key: BOOTSTRAP_TENANT_CODE
        value: orange
      - key: BOOTSTRAP_TENANT_NAME
        value: Orange
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: reviewer@orange.example
      - key: BOOTSTRAP_ADMIN_DISPLAY_NAME
        value: Assignment Reviewer
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
