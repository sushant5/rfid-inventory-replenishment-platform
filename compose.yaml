services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abacus
      POSTGRES_USER: abacus
      POSTGRES_PASSWORD: abacus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abacus -d abacus"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://abacus:abacus@postgres:5432/abacus
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-local-platform-key-change-before-deploy}
      BOOTSTRAP_TENANT_CODE: ${BOOTSTRAP_TENANT_CODE:-orange}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Orange}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-reviewer@orange.example}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Assignment Reviewer}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["uvicorn", "abacus.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://abacus:abacus@postgres:5432/abacus
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-local-platform-key-change-before-deploy}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://abacus:abacus@postgres:5432/abacus
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-local-platform-key-change-before-deploy}
    command: ["python", "-m", "abacus.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
