name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: abacus_test
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abacus -d abacus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://abacus_app:ci-app-only@localhost:5432/abacus_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
      TEST_DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://abacus_app:ci-app-only@localhost:5432/abacus_test
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      PLATFORM_API_KEY: ci-only-platform-key-long-enough
      APPLICATION_DATABASE_ROLE: abacus_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Create non-superuser application role
        env:
          PGPASSWORD: abacus
        run: >-
          psql -h localhost -U abacus -d abacus_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE abacus_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci-app-only';"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: >-
          mypy src
          scripts/run_architecture_demo.py
          scripts/rfid_simulator.py
          scripts/smoke_test.py
          scripts/public_demo_smoke.py
          scripts/generate_store_batch.py
          scripts/generate_showcase_catalog.py
          scripts/check_branch_coverage.py
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Migrate clean database
        run: alembic upgrade head
      - name: Verify full migration rollback chain
        run: alembic downgrade base && alembic upgrade head
      - name: Test
        run: >-
          python -m pytest --cov=abacus --cov-report=term-missing
          --cov-report=xml --cov-report=json
      - name: Verify branch coverage
        run: python scripts/check_branch_coverage.py coverage.json --minimum 70
      - name: Verify migration metadata
        run: alembic check
      - name: Build image
        run: docker build --tag abacus-rfid-platform:${{ github.sha }} .
      - name: Smoke-test installed runtime
        run: >-
          docker run --rm --entrypoint python
          abacus-rfid-platform:${{ github.sha }}
          -c "from abacus.main import app; assert app.openapi()['info']['version']"
      - name: Validate Compose model
        run: docker compose -f docker-compose.yml config --quiet

  readme-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start the clean Compose stack
        run: docker compose up --build -d --wait
      - name: Run the documented migration command
        run: make migrate
      - name: Run the documented seed command
        run: make seed
      - name: Run the complete documented demo
        run: make demo
      - name: Smoke-test the running API
        run: python3 scripts/smoke_test.py --base-url http://localhost:8000
      - name: Prove service restart recovery
        run: |
          docker compose restart api catalog-worker event-worker
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200
          exit 1
      - name: Smoke-test after restart
        run: python3 scripts/smoke_test.py --base-url http://localhost:8000
      - name: Verify every long-running process recovered
        run: |
          docker compose ps --status running --services | sort > /tmp/actual-services
          printf '%s\n' api catalog-worker event-worker postgres | sort > /tmp/expected-services
          diff -u /tmp/expected-services /tmp/actual-services
      - name: Run the documented test command
        run: make test
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down the clean stack
        if: always()
        run: docker compose down --volumes --remove-orphans
