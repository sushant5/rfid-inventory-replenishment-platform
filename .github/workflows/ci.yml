name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: abacus_test
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abacus -d abacus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
      TEST_DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      PLATFORM_API_KEY: ci-only-platform-key-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src scripts/run_reviewer_demo.py scripts/generate_store_batch.py
      - name: Migrate clean database
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=abacus --cov-report=term-missing --cov-report=xml
      - name: Verify migration metadata
        run: alembic check
      - name: Build recruiter response PDF
        run: >-
          python scripts/build_engineering_response_pdf.py
          docs/Sushant_Engineering_Response.md
          /tmp/Sushant_GreyOrange_Engineering_Take_Home_Answers.pdf
      - name: Build image
        run: docker build --tag abacus-rfid-platform:${{ github.sha }} .
