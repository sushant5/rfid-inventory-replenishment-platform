name: CI

on:
  push:
    branches: [main, architecture-aligned-v5]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: abacus_test
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abacus -d abacus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
      TEST_DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://abacus_app:ci-app-only@localhost:5432/abacus_test
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      PLATFORM_API_KEY: ci-only-platform-key-long-enough
      APPLICATION_DATABASE_ROLE: abacus_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Create non-superuser application role
        env:
          PGPASSWORD: abacus
        run: >-
          psql -h localhost -U abacus -d abacus_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE abacus_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci-app-only';"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: >-
          mypy src
          scripts/run_architecture_demo.py
          scripts/rfid_simulator.py
          scripts/smoke_test.py
          scripts/generate_store_batch.py
      - name: Migrate clean database
        run: alembic upgrade head
      - name: Verify latest migration rollback
        run: alembic downgrade -1 && alembic upgrade head
      - name: Test
        run: python -m pytest --cov=abacus --cov-report=term-missing --cov-report=xml
      - name: Verify migration metadata
        run: alembic check
      - name: Build image
        run: docker build --tag abacus-rfid-platform:${{ github.sha }} .
      - name: Validate Compose model
        run: docker compose -f docker-compose.yml config --quiet
